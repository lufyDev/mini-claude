<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>mini-claude</title>
<style>
  :root {
    --bg:#0f1115; --panel:#161920; --line:#262b36; --fg:#e6e8ec; --dim:#8b93a3;
    --accent:#ff6b4a; --ok:#49c17a; --bad:#e2564a; --think:#7a86ff;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  * { box-sizing:border-box; }
  body { margin:0; background:var(--bg); color:var(--fg); height:100vh; display:flex; flex-direction:column; }

  header { padding:12px 16px; border-bottom:1px solid var(--line); display:flex; gap:12px;
           align-items:baseline; flex:none; }
  header b { color:var(--accent); letter-spacing:.5px; }
  header span { color:var(--dim); font-size:12px; }
  header .right { margin-left:auto; }

  #body { flex:1; display:flex; min-height:0; }
  #main { flex:1; display:flex; flex-direction:column; min-width:0; }

  #log { flex:1; overflow-y:auto; padding:16px; display:flex; flex-direction:column; gap:10px; }
  /* Without this every child shrinks once the column overflows and the tool
     rows collapse into slivers. flex children default to flex-shrink:1. */
  #log > * { flex:0 0 auto; }
  /* Bottom-anchor the transcript like a chat. An auto top margin on a spacer
     collapses to 0 once content overflows, so scrolling still works --
     justify-content:flex-end would clip the top instead. */
  #log::before { content:""; margin-top:auto; }

  .msg { max-width:900px; white-space:pre-wrap; word-break:break-word; line-height:1.5; font-size:14px; }
  .user { color:var(--accent); }
  .user::before { content:"> "; }
  .thinking { color:var(--think); font-size:12.5px; opacity:.85; border-left:2px solid var(--think); padding-left:10px; }
  .error { color:var(--bad); }
  .usage { color:var(--dim); font-size:12px; }

  .tool { background:var(--panel); border:1px solid var(--line); border-radius:6px; font-size:13px; overflow:hidden; }
  .tool-head { padding:7px 10px; display:flex; gap:8px; align-items:center; cursor:pointer; min-height:32px; }
  .tool-head .name { color:var(--accent); flex:none; }
  .tool-head .args { color:var(--dim); flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  .tool-head .ms { color:var(--dim); font-size:11px; flex:none; }
  .dot { width:7px; height:7px; border-radius:50%; background:var(--dim); flex:none; }
  .dot.ok { background:var(--ok); } .dot.bad { background:var(--bad); }
  .tool-body { display:none; padding:8px 10px; border-top:1px solid var(--line); color:var(--dim);
               white-space:pre-wrap; max-height:260px; overflow:auto; font-size:12px; }
  .tool.open .tool-body { display:block; }

  /* ---- workspace sidebar ---- */
  #side { width:230px; flex:none; border-left:1px solid var(--line); display:flex; flex-direction:column;
          background:#12151b; }
  #side h2 { margin:0; padding:11px 12px; font-size:11px; letter-spacing:1px; text-transform:uppercase;
             color:var(--dim); border-bottom:1px solid var(--line); display:flex; align-items:center; gap:6px; }
  #side h2 button { margin-left:auto; background:none; border:0; color:var(--dim); cursor:pointer;
                    font:inherit; font-size:14px; padding:0 2px; }
  #side h2 button:hover { color:var(--accent); }
  #files { flex:1; overflow-y:auto; padding:6px; }
  #files .f { display:flex; gap:8px; padding:5px 7px; border-radius:4px; cursor:pointer; font-size:12.5px; }
  #files .f:hover { background:var(--panel); }
  #files .f.active { background:var(--panel); color:var(--accent); }
  #files .f .n { flex:1; min-width:0; overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
  #files .f .s { color:var(--dim); font-size:11px; flex:none; }
  #files .empty { color:var(--dim); font-size:12px; padding:10px 7px; line-height:1.5; }
  #side.hidden { display:none; }

  /* ---- file viewer overlay ---- */
  #viewer { position:fixed; inset:0; background:rgba(8,10,14,.75); display:none; z-index:10;
            align-items:center; justify-content:center; padding:32px; }
  #viewer.open { display:flex; }
  #viewer .card { background:var(--bg); border:1px solid var(--line); border-radius:8px; width:min(900px,100%);
                  max-height:100%; display:flex; flex-direction:column; }
  #viewer .bar { padding:10px 14px; border-bottom:1px solid var(--line); display:flex; align-items:center; gap:10px; }
  #viewer .bar .p { color:var(--accent); font-size:13px; }
  #viewer .bar button { margin-left:auto; background:none; border:0; color:var(--dim); font:inherit;
                        font-size:18px; cursor:pointer; }
  #viewer pre { margin:0; padding:14px; overflow:auto; font-size:12.5px; line-height:1.55;
                white-space:pre-wrap; word-break:break-word; }

  form { display:flex; gap:8px; padding:12px 16px; border-top:1px solid var(--line); flex:none; }
  input { flex:1; min-width:0; background:var(--panel); border:1px solid var(--line); color:var(--fg);
          padding:10px 12px; border-radius:6px; font:inherit; font-size:14px; }
  input:focus { outline:none; border-color:var(--accent); }
  button.send { background:var(--accent); border:0; color:#140d0a; padding:0 18px; border-radius:6px;
                font:inherit; font-weight:600; cursor:pointer; }
  button.send:disabled { opacity:.4; cursor:default; }

  @media (max-width: 700px) {
    #side { display:none; }
    #viewer { padding:12px; }
  }
</style>
</head>
<body>
<header>
  <b>mini-claude</b><span>agent loop + tools + SSE trace</span>
  <span class="right" id="meta"></span>
</header>

<div id="body">
  <div id="main">
    <div id="log"></div>
    <form id="form">
      <input id="input" placeholder="create hello.py that prints the first 10 primes, then run it" autocomplete="off">
      <button class="send" id="send">send</button>
    </form>
  </div>
  <aside id="side">
    <h2>workspace <button id="refresh" title="refresh">&#8635;</button></h2>
    <div id="files"></div>
  </aside>
</div>

<div id="viewer"><div class="card">
  <div class="bar"><span class="p" id="vpath"></span><button id="vclose">&times;</button></div>
  <pre id="vbody"></pre>
</div></div>

<script>
const log = document.getElementById("log");
const form = document.getElementById("form");
const input = document.getElementById("input");
const send = document.getElementById("send");
const filesEl = document.getElementById("files");
const viewer = document.getElementById("viewer");
const sessionId = Math.random().toString(36).slice(2);

const atBottom = () => log.scrollHeight - log.scrollTop - log.clientHeight < 60;
const scroll = (was) => { if (was) log.scrollTop = log.scrollHeight; };

function add(cls, text = "") {
  const el = document.createElement("div");
  el.className = "msg " + cls;
  el.textContent = text;
  log.appendChild(el);
  log.scrollTop = log.scrollHeight;
  return el;
}

/* ---------------------------------------------------------- workspace pane */

function fmtSize(n) {
  return n < 1024 ? n + " B" : (n / 1024).toFixed(1) + " K";
}

async function loadFiles() {
  let data;
  try { data = await (await fetch("/api/files")).json(); }
  catch { return; }
  filesEl.innerHTML = "";
  if (!data.files.length) {
    const e = document.createElement("div");
    e.className = "empty";
    e.textContent = "empty — ask the agent to create something";
    filesEl.appendChild(e);
    return;
  }
  for (const f of data.files) {
    const row = document.createElement("div");
    row.className = "f";
    const n = document.createElement("span"); n.className = "n"; n.textContent = f.path;
    const s = document.createElement("span"); s.className = "s"; s.textContent = fmtSize(f.size);
    row.append(n, s);
    row.onclick = () => openFile(f.path);
    filesEl.appendChild(row);
  }
}

async function openFile(path) {
  const data = await (await fetch("/api/file?path=" + encodeURIComponent(path))).json();
  document.getElementById("vpath").textContent = path;
  document.getElementById("vbody").textContent = data.error || data.content || "(empty file)";
  viewer.classList.add("open");
}

document.getElementById("vclose").onclick = () => viewer.classList.remove("open");
viewer.onclick = (e) => { if (e.target === viewer) viewer.classList.remove("open"); };
document.addEventListener("keydown", (e) => {
  if (e.key === "Escape") viewer.classList.remove("open");
});
document.getElementById("refresh").onclick = loadFiles;

/* ------------------------------------------------------------ event stream */

let current = { text: null, thinking: null, tools: {}, lastTool: null };

function handle(ev) {
  const was = atBottom();
  switch (ev.type) {
    case "thinking_start":
      current.thinking = add("thinking", "");
      current.text = null;
      break;
    case "thinking":
      if (!current.thinking) current.thinking = add("thinking", "");
      current.thinking.textContent += ev.text;
      break;
    case "text":
      if (!current.text) current.text = add("assistant", "");
      current.text.textContent += ev.text;
      current.thinking = null;
      break;
    case "tool_start": {
      current.text = null; current.thinking = null;
      const box = document.createElement("div");
      box.className = "tool";
      box.innerHTML = `<div class="tool-head"><span class="dot"></span>
        <span class="name"></span><span class="args"></span><span class="ms"></span></div>
        <div class="tool-body"></div>`;
      box.querySelector(".name").textContent = ev.name;
      box.querySelector(".tool-head").onclick = () => box.classList.toggle("open");
      log.appendChild(box);
      current.tools[ev.id] = box;
      current.lastTool = box;
      break;
    }
    case "tool_input":
      if (current.lastTool) {
        const a = current.lastTool.querySelector(".args");
        a.textContent = (a.textContent + ev.partial).slice(-160);
      }
      break;
    case "tool_result": {
      const box = current.tools[ev.id];
      if (box) {
        box.querySelector(".dot").classList.add(ev.ok ? "ok" : "bad");
        box.querySelector(".ms").textContent = ev.ms + "ms";
        box.querySelector(".tool-body").textContent = ev.result;
        if (!ev.ok) box.classList.add("open");
      }
      // the agent may have just written or deleted something
      if (["write_file", "run_bash"].includes(ev.name)) loadFiles();
      break;
    }
    case "error":
      add("error", "! " + ev.message);
      break;
    case "done": {
      const u = ev.usage || {};
      const cost = u.usd !== undefined ? `$${u.usd.toFixed(4)}` : "?";
      add("usage", `turn ${cost} · in ${u.input ?? 0} (cached ${u.cached ?? 0}) · out ${u.output ?? 0} · session ${ev.summary || ""}`);
      loadFiles();
      break;
    }
  }
  scroll(was);
}

form.onsubmit = async (e) => {
  e.preventDefault();
  const text = input.value.trim();
  if (!text) return;
  input.value = "";
  send.disabled = true;
  add("user", text);
  current = { text: null, thinking: null, tools: {}, lastTool: null };

  try {
    const res = await fetch("/api/chat", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ session_id: sessionId, message: text }),
    });

    // Parse the SSE frames off the response body ourselves: EventSource is
    // GET-only, and we need to POST the message.
    const reader = res.body.getReader();
    const decoder = new TextDecoder();
    let buffer = "";
    while (true) {
      const { value, done } = await reader.read();
      if (done) break;
      buffer += decoder.decode(value, { stream: true });
      const frames = buffer.split("\n\n");
      buffer = frames.pop();
      for (const frame of frames) {
        const line = frame.split("\n").find(l => l.startsWith("data: "));
        if (line) handle(JSON.parse(line.slice(6)));
      }
    }
  } catch (err) {
    add("error", "! " + err.message);
  } finally {
    send.disabled = false;
    input.focus();
  }
};

fetch("/api/meta").then(r => r.json()).then(m => {
  document.getElementById("meta").textContent = `${m.model} · budget $${m.budget_usd.toFixed(2)}`;
});
loadFiles();
input.focus();
</script>
</body>
</html>
